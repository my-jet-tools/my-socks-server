services:
  my-socks-server:
    build: .
    image: my-socks-server:latest
    platform: linux/amd64
    container_name: my-socks-server
    restart: unless-stopped
    # Host networking: the proxy sees the real client IPs (client_whitelist and bans rely on
    # them), and no Docker NAT sits in front of every proxied connection. The port comes from
    # listen_address in the settings file.
    network_mode: host
    environment:
      RUST_LOG: info
      LOG_FORMAT: json
    volumes:
      # Settings live in ~/.mysocksserver of whoever runs compose, and are seen by the server
      # as ~/.mysocksserver inside the container too (HOME=/home/socks). Prepare once:
      #   cp settings.example.yaml ~/.mysocksserver          # edit it
      #   sudo chown 65534 ~/.mysocksserver && sudo chmod 600 ~/.mysocksserver
      # (the container runs as nobody, 65534). A missing file fails `up` instead of Docker
      # silently creating a directory in its place.
      - type: bind
        source: ${HOME}/.mysocksserver
        target: /home/socks/.mysocksserver
        read_only: true
        bind:
          create_host_path: false
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    # Longer than shutdown_grace_sec, so the drain is not cut short by SIGKILL.
    stop_grace_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 50m
        max-file: "3"
